# Generated by create-line-harness. Safe to overwrite on future setup runs.
name = "line-harness"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
account_id = "bdfed00c875b06dd0677c35e3c8ff9be"

# Worker runs before static assets so bot UAs get OGP HTML injection;
# normal UAs fall through to the SPA via env.ASSETS.fetch().
[assets]
directory = "dist/client"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "line-harness"
database_id = "e9269771-b9b8-4e3a-a9e2-01e3491c9487"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "line-harness-images"

[triggers]
crons = ["*/5 * * * *", "0 */6 * * *"]

[vars]
WORKER_NAME = "line-harness"
ADMIN_PAGES_PROJECT = "line-harness-admin-68b593ab"
LIFF_PAGES_PROJECT = ""
D1_DATABASE_ID = "e9269771-b9b8-4e3a-a9e2-01e3491c9487"
MANIFEST_URL = "https://github.com/Shudesu/line-harness-oss/releases/latest/download/release-manifest.json"
WORKER_PUBLIC_URL = "https://line-harness.baibanglian-line-harness.workers.dev"
ADMIN_PUBLIC_URL = "https://line-harness-admin-68b593ab.pages.dev"
LIFF_PUBLIC_URL = "https://line-harness.baibanglian-line-harness.workers.dev"
CF_ACCOUNT_ID = "bdfed00c875b06dd0677c35e3c8ff9be"
ADMIN_ORIGIN = "https://line-harness-admin-68b593ab.pages.dev,http://localhost:3001"
ADMIN_ALLOW_CROSS_SITE = "true"
